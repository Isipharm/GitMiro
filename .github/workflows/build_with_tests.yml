# Workflow to run with every commit added to the main branch.
# Legacy Compose Windows/macOS and LibSSH builds remain excluded to limit CI time.

name: Test Build

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main", "feat/rust-port" ]

permissions:
  contents: read

jobs:
  build_tauri_windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: rust
        run: npm ci
      - name: Check Rust formatting
        working-directory: rust/src-tauri
        run: cargo fmt --check
      - name: Lint Rust backend
        working-directory: rust/src-tauri
        run: cargo clippy -- -D warnings
      - name: Test Rust backend
        working-directory: rust/src-tauri
        run: cargo test
      - name: Build Windows installers
        working-directory: rust
        run: npm run tauri build

  build_tauri_unix:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils
      - name: Install frontend dependencies
        working-directory: rust
        run: npm ci
      - name: Build desktop packages
        working-directory: rust
        run: npm run tauri build

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'jetbrains'
          architecture: x64
      - name: Build with Gradle
        uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
        with:
          # app:compileKotlin depends on rustTasks, which generates ignored UniFFI sources.
          arguments: build
      - name: Tests
        uses: gradle/gradle-build-action@67421db6bd0bf253fb4bd25b31ebb98943c375e1
        with:
          arguments: test
