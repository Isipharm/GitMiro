# Builds the Windows installer and portable ZIP, then publishes them as a GitHub release.
# Triggered by hand from the Actions tab ("Run workflow"), with the version to release.
# The version must already be set in the code (see the "Check version" step).

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (must match projectVersion and AppConstants.APP_VERSION)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft, to review it before publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build_windows:
    runs-on: windows-latest
    env:
      # Passed through the environment instead of being inlined in scripts, so the input can't inject commands
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Fonts in app/src/main/composeResources/font are stored in Git LFS
          lfs: true

      - name: Check version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$env:VERSION' must look like 1.2.3 (jpackage only accepts numeric versions)"
          }

          $escaped = [regex]::Escape($env:VERSION)
          $gradle = Get-Content app/build.gradle.kts -Raw
          $constants = Get-Content app/src/main/kotlin/com/hugodehu/gitmiro/AppConstants.kt -Raw

          $mismatches = @()
          if ($gradle -notmatch "val projectVersion = `"$escaped`"") { $mismatches += "projectVersion in app/build.gradle.kts" }
          if ($gradle -notmatch "val projectVersionSimplified = `"$escaped`"") { $mismatches += "projectVersionSimplified in app/build.gradle.kts" }
          if ($constants -notmatch "APP_VERSION = `"$escaped`"") { $mismatches += "APP_VERSION in AppConstants.kt" }

          if ($mismatches.Count -gt 0) {
            throw "Version $env:VERSION doesn't match the code, update: $($mismatches -join ', ') (and APP_VERSION_CODE)"
          }

      # The Rust toolchain (nightly) is selected by rs/rust-toolchain.toml, rustup installs it on first use
      - uses: dtolnay/rust-toolchain@stable

      # The JetBrains Runtime SDK ships jmods, which jlink needs for includeAllModules (Temurin 25 doesn't)
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
          architecture: x64

      # Building OpenSSL from source takes most of the build time, keep the Rust build between releases
      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: rust-windows-${{ hashFiles('rs/Cargo.toml', 'rs/rust-toolchain.toml', 'rs/src/**') }}
          restore-keys: rust-windows-

      # Strawberry Perl, required to build OpenSSL, is preinstalled on windows-latest
      - name: Build the application
        run: cmd /C gradlew.bat createDistributable --console=plain

      - name: Build the installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: gitnuro.iss
          options: /O+ /DMyAppVersion="${{ env.VERSION }}"

      - name: Build the portable ZIP
        shell: pwsh
        run: Compress-Archive -Path app/build/compose/binaries/main/app/GitMiro/* -DestinationPath "Output/GitMiro_Windows_Portable_$env:VERSION.zip"

      - name: Generate SHA-256 checksums
        shell: pwsh
        working-directory: Output
        run: |
          Get-ChildItem -File | Where-Object Extension -in '.exe', '.zip' | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.Name).sha256"
          }

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: GitMiro ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Output/GitMiro_Windows_Installer_*.exe
            Output/GitMiro_Windows_Portable_*.zip
            Output/*.sha256
